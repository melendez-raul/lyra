name: Release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias del sistema
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - run: pip install pyinstaller -r requirements.txt

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller --clean --onefile --name lyra --add-data "src/lyra/frontend:frontend" src/lyra/main.py

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --clean --onefile --windowed --name lyra --add-data "src/lyra/frontend;frontend" src/lyra/main.py

      - uses: actions/upload-artifact@v4
        with:
          name: lyra-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
